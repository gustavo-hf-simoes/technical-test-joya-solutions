# =============================================================================
# docker-compose.yml — banco (US-04) e API (US-13).
#
#   db       SQL Server 2022, dados em volume nomeado, publicado só no loopback
#            (MCP e `dotnet run`). Healthcheck real: só fica saudável com todos os bancos ONLINE
#            (evita o erro 904 do db-init quando o JoyaPedidos ainda se recupera).
#   db-init  Efêmero (D15). Mesma imagem do db, que já traz o sqlcmd. Roda
#            database/init.sh, o MESMO executor dos testes de integração
#            (ADR-0003). Só começa com o db saudável e sai com 0.
#   api      ASP.NET Core sem root (backend/Dockerfile). Conecta como joya_app (nunca sa),
#            só depois do db-init concluir. Swagger só no loopback (127.0.0.1:8080).
#
# Senhas: valores padrão de DESENVOLVIMENTO, sobrescrevíveis por variável de
# ambiente ou por um .env local (modelo em .env.example). Em produção, nunca
# use os padrões (deploy/ tem o seu próprio compose).
#
# A tag da imagem é a mesma do fixture dos testes (ADR-0003, item 6).
# =============================================================================
name: joya-pedidos

x-sql-image: &sql-image mcr.microsoft.com/mssql/server:2022-latest

services:
  db:
    image: *sql-image
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Joya_Dev_Sa_2026}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # A senha vai por SQLCMDPASSWORD (nunca por -P na linha de comando).
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -Q "IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE') THROW 50000, 'banco ainda em recuperacao', 1;" > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: *sql-image
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_HOST: db
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Joya_Dev_Sa_2026}
      APP_SQL_PASSWORD: ${APP_SQL_PASSWORD:-Pedidos_Api_2026}
      # O .mcp.json lê a mesma variável (MCP_SQL_PASSWORD) e precisa do mesmo padrão (PROP-04-01).
      # A senha NÃO pode conter o nome do login: o SQL Server a rejeita (erro 33064).
      MCP_SQL_PASSWORD: ${MCP_SQL_PASSWORD:-Mcp_Leitura_2026}
    volumes:
      - ./database:/database:ro
    entrypoint: ["bash", "/database/init.sh"]

  api:
    build: ./backend
    image: joya-pedidos-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      # Ambiente "Docker": liga o Swagger (Program.cs) e nada mais.
      ASPNETCORE_ENVIRONMENT: Docker
      # Login de menor privilégio. O certificado do SQL Server do contêiner é autoassinado.
      ConnectionStrings__Default: Server=db,1433;Database=JoyaPedidos;User Id=joya_app;Password=${APP_SQL_PASSWORD:-Pedidos_Api_2026};Encrypt=True;TrustServerCertificate=True;
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sqlserver-data:
