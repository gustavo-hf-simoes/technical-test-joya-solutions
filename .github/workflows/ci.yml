# Integração contínua (HL-04: o CI existe desde o primeiro commit e roda em todo push e PR).
#
# Jobs:
#   config  — valida a configuração AI-first: frontmatter de agentes e skills, JSON,
#             links do Markdown, os hooks de limite (guard-paths / guard-bash) e a matriz
#             de rastreabilidade (HL-08).
#   CodeQL fica em codeql.yml.
#   backend     — build, formatação e testes unitários.
#   integracao  — testes de integração contra SQL Server real (Testcontainers; Docker do runner).
#                 A medição da Parte 4 (Categoria=Medicao) fica de fora (HL-27).
#   frontend    — lint, testes (ChromeHeadless) e build do Angular.
#   e2e         — Playwright contra `docker compose up`; depende de backend e frontend.
#
# Segurança (skill gha-security-review): permissões mínimas, actions fixadas por SHA,
# sem `pull_request_target` e sem interpolar dados do evento em `run:`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Configuração AI-first
    runs-on: ubuntu-24.04 # fixado: o rótulo ubuntu-latest migra para o Ubuntu 26 em 2026-10-19
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # a rastreabilidade confere se os commits citados existem no histórico

      - name: Instalar PyYAML
        run: python3 -m pip install --disable-pip-version-check --quiet "pyyaml==6.0.2"

      - name: Validar agentes, skills, JSON e links
        run: python3 .github/scripts/validar_config.py

      - name: Testar hooks de limite dos agentes
        run: bash .github/scripts/testar_hooks.sh

      - name: Testar o validador de rastreabilidade
        run: bash .github/scripts/testar_rastreabilidade.sh

      - name: Validar rastreabilidade enunciado → teste → commit (HL-08)
        run: python3 .github/scripts/validar_rastreabilidade.py

  backend:
    name: Backend (build, format, unitários)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: backend/global.json

      - name: Compilar (falha com qualquer warning)
        run: dotnet build backend/Joya.Pedidos.sln --configuration Release

      - name: Verificar formatação
        run: dotnet format backend/Joya.Pedidos.sln --verify-no-changes

      - name: Testes unitários
        run: dotnet test backend/tests/Joya.Pedidos.UnitTests --configuration Release --no-build

  integracao:
    name: Integração (SQL Server real)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: backend/global.json

      - name: Testes de integração (sem a medição da Parte 4)
        run: >-
          dotnet test backend/tests/Joya.Pedidos.IntegrationTests
          --configuration Release --filter "Categoria!=Medicao"

  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Testes unitários (ChromeHeadless)
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build de produção
        run: npm run build

  e2e:
    name: E2E (Playwright + compose)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:4200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # O compose já traz senhas padrão de desenvolvimento; nenhum segredo real é necessário.
      - name: Subir a aplicação (banco, schema, API e frontend)
        run: docker compose up -d --build --wait frontend

      - name: Instalar dependências do E2E
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Rodar o Playwright (Chrome do runner)
        working-directory: e2e
        run: npm test

      - name: Logs do compose (só em falha)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Enviar relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Derrubar a aplicação
        if: always()
        run: docker compose down -v
