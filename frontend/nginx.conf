server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Barreira externa mais larga que a da API (ADR-0002): quem devolve o 413 em Problem Details é a API.
  client_max_body_size 64k;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Mesma origem: o Nginx tira o prefixo /api (barra final no proxy_pass) e a API não precisa de CORS (D14).
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ativos com hash no nome: cache longo.
  location ~* \.(?:js|css|ico|png|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA: qualquer rota do Angular cai no index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }
}
